<!doctype html>
<html lang="zh-CN" data-theme="industrial">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ChatGPT 账号</title>
  <link rel="stylesheet" href="./accounts.css">
  <script type="module" src="./accounts.js"></script>
</head>
<body>
  <main class="account-page">
    <header class="account-heading">
      <div><p class="nx-label text-nexus-300">ChatGPT OAuth</p><h1 class="text-xl font-semibold text-zinc-100 mt-2">账号管理</h1><p class="text-sm text-zinc-400 mt-2">登录账号，再将账号用于服务上游。账号操作不会自动发布服务。</p></div>
      <div class="account-actions"><button id="refresh" class="nx-btn-ghost">刷新</button><button id="new-account" class="nx-btn-primary">添加账号</button></div>
    </header>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <section class="nx-panel" aria-label="账号列表">
      <header class="nx-panel-head"><h2 class="nx-panel-head-title"><span class="nx-stripe"></span>已添加账号</h2><span id="account-count" class="nx-label">—</span></header>
      <div id="accounts" class="account-list" aria-live="polite"><p class="p-5 text-sm text-zinc-400">正在加载账号…</p></div>
    </section>
    <p class="text-xs text-zinc-400 mt-4">账号凭据仅由后端保存。本页只显示账号摘要；运行时引用状态未知。</p>
  </main>

  <dialog id="login-dialog" class="account-dialog" aria-labelledby="login-title">
    <header class="nx-panel-head"><h2 id="login-title" class="nx-panel-head-title"><span class="nx-stripe"></span>登录账号</h2><button id="close-login" class="nx-btn-ghost" aria-label="关闭登录窗口">关闭</button></header>
    <div class="p-5 space-y-4">
      <div id="login-methods" class="account-actions" role="group" aria-label="登录方式">
        <button id="method-device" class="nx-btn-primary" aria-pressed="true">设备码登录</button><button id="method-pkce" class="nx-btn-ghost" aria-pressed="false">备用：浏览器登录</button>
      </div>
      <p id="method-help" class="text-sm text-zinc-400">在验证页面输入设备码，完成后此处会自动更新。</p>
      <div id="login-notice" role="status" aria-live="polite" hidden></div>
      <div id="session-content" hidden>
        <div class="flex items-center justify-between gap-3"><span id="login-state" class="nx-badge-standby"></span><span id="login-expiry" class="text-xs text-zinc-400"></span></div>
        <div id="device-code-panel" class="code-panel mt-4" hidden><p class="nx-label">设备码</p><p id="device-code" class="nx-display text-2xl text-nexus-300 mt-2 select-all"></p><button id="copy-code" class="nx-btn-ghost mt-2">复制设备码</button></div>
        <div id="verification-panel" class="space-y-2 mt-4" hidden>
          <label class="block"><span class="nx-label">验证地址</span><input id="verification-url" class="nx-input w-full mt-2" readonly aria-label="验证地址"></label>
          <div class="account-actions"><button id="open-verification" class="nx-btn-primary">打开验证页面</button><button id="copy-verification" class="nx-btn-ghost">复制地址</button><a id="verification-link" class="text-sm text-nexus-300 underline" target="_blank" rel="noopener noreferrer">直接打开</a></div>
          <p class="text-xs text-zinc-400">若浏览器阻止弹窗，请使用宿主顶部确认按钮，或复制地址自行打开。</p>
        </div>
        <div id="callback-form" role="form" aria-label="提交回调地址" class="space-y-3 mt-4" hidden>
          <label class="block"><span class="nx-label">完整回调地址</span><input id="callback-url" type="password" class="nx-input w-full mt-2" autocomplete="off" spellcheck="false" maxlength="4096" placeholder="粘贴登录后跳转的完整 localhost 地址" required></label>
          <p class="text-xs text-zinc-400">页面无法连接 localhost 时，复制地址栏内容并粘贴。提交后立即清空，不写入浏览器存储或历史记录。</p>
          <button id="submit-callback" class="nx-btn-primary" type="button">提交回调地址</button>
        </div>
        <p id="login-result" class="text-sm text-zinc-300 mt-4"></p>
      </div>
      <div class="account-actions border-t border-carbon-600 pt-4">
        <button id="start-login" class="nx-btn-primary">开始设备码登录</button>
        <button id="retry-status" class="nx-btn-ghost" hidden>刷新登录状态</button>
        <button id="cancel-login" class="nx-btn-ghost" hidden>取消登录</button>
        <button id="new-service" class="nx-btn-primary" hidden>新建服务</button>
      </div>
    </div>
  </dialog>

  <dialog id="action-dialog" class="account-dialog" aria-labelledby="action-title">
    <header class="nx-panel-head"><h2 id="action-title" class="nx-panel-head-title"></h2></header>
    <div id="account-action-form" role="form" aria-label="账号操作" class="p-5 space-y-4">
      <p id="action-account" class="text-sm text-zinc-200 break-all"></p>
      <label id="rename-field" class="block space-y-2" hidden><span class="nx-label">账号名称</span><input id="account-label" class="nx-input w-full" maxlength="512" autocomplete="off"></label>
      <div id="reference-summary" class="text-sm text-zinc-300 space-y-2"></div>
      <p id="action-warning" class="text-sm text-amber-300"></p>
      <div id="action-notice" role="alert" hidden></div>
      <div class="account-actions justify-end"><button id="cancel-action" type="button" class="nx-btn-ghost">取消</button><button id="confirm-action" type="button" class="nx-btn-primary">确认</button></div>
    </div>
  </dialog>
</body>
</html>
