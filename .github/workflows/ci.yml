name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe Bun SQLite runtime
        run: >-
          bun -e "import { Database } from 'bun:sqlite'; const db = new
          Database(':memory:'); const row = db.query('SELECT sqlite_version() AS
          sqlite_version, sqlite_source_id() AS sqlite_source_id').get();
          console.log(JSON.stringify({ os: process.platform, arch: process.arch,
          bun_version: Bun.version, ...row })); db.close();"

      - name: Install Playwright browsers
        if: matrix.os == 'ubuntu-latest'
        run: bunx playwright install --with-deps chromium

      - name: Build full pipeline
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Run static migration guards
        run: bun test packages/ui/src/migration-guards.test.ts

      - name: Start Vite dev server
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd packages/ui && bun run dev &
          echo "VITE_PID=$!" >> $GITHUB_ENV

      - name: Wait for Vite dev server
        if: matrix.os == 'ubuntu-latest'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Vite server failed to start"
          exit 1

      - name: Run Playwright smoke tests
        if: matrix.os == 'ubuntu-latest'
        run: bun run test:ui:smoke -- --base-url http://localhost:5173 --strict-testids

      - name: Stop Vite dev server
        if: always() && matrix.os == 'ubuntu-latest'
        run: kill $VITE_PID 2>/dev/null || true
