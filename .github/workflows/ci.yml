name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers and Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: bun ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Install Playwright browsers
        if: matrix.os != 'ubuntu-latest'
        run: bun ./node_modules/playwright/cli.js install chromium

      - name: Build full pipeline
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Start Vite dev server
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd packages/ui && bun run dev &
          echo "VITE_PID=$!" >> $GITHUB_ENV

      - name: Wait for Vite dev server
        if: matrix.os == 'ubuntu-latest'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Vite server failed to start"
          exit 1

      - name: Run Playwright smoke tests
        if: matrix.os == 'ubuntu-latest'
        run: bun run test:ui:smoke -- --base-url http://localhost:5173 --strict-testids

      - name: Run route editor target regression browser tests
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 2
        run: node packages/ui/tests/route-editor-target.browser.mjs

      - name: Run native dashboard ownership regression
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 2
        env:
          DASHBOARD_BASE_URL: http://localhost:5173
        run: bun packages/ui/tests/dashboard-playwright.ts --native

      - name: Stop Vite dev server
        if: always() && matrix.os == 'ubuntu-latest'
        run: kill $VITE_PID 2>/dev/null || true

      - name: Record tested PR contents
        if: matrix.os == 'ubuntu-latest'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-provenance"
          jq -n \
            --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg head "$PR_HEAD_SHA" \
            --argjson pr "$PR_NUMBER" \
            '{tree: $tree, head: $head, pr: $pr}' \
            > "$RUNNER_TEMP/ci-provenance/pr.json"

      - name: Upload tested PR contents
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tested-pr
          path: ${{ runner.temp }}/ci-provenance/pr.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
