name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers and Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: bun ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Install Playwright browsers
        if: matrix.os != 'ubuntu-latest'
        run: bun ./node_modules/playwright/cli.js install chromium

      - name: Build full pipeline
        run: bun run build

      - name: Run tests
        if: matrix.os != 'windows-latest'
        run: bun test

      - name: Run tests (Windows watchdog, 15 min cap)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $timeoutMs = 15 * 60 * 1000
          $outLog = Join-Path $env:RUNNER_TEMP 'bun-test-stdout.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'bun-test-stderr.log'
          $bun = (Get-Command bun -CommandType Application -ErrorAction Stop).Source
          $proc = Start-Process -FilePath $bun -ArgumentList 'test' -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $outLog -RedirectStandardError $errLog -PassThru -NoNewWindow
          if (-not $proc.WaitForExit($timeoutMs)) {
            Write-Host "::error::bun test exceeded 15 minutes; sanitized bun process table follows"
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object ProcessName -eq 'bun.exe' | ForEach-Object {
              $cmd = [string]$_.CommandLine
              [pscustomobject]@{
                ProcessId       = $_.ProcessId
                ParentProcessId = $_.ParentProcessId
                CreationDate    = $_.CreationDate
                has_daemon_boot = [bool]($cmd -match '--bungee-daemon-boot=')
                has_core_main   = [bool]($cmd -match 'packages[\\/]core[\\/](?:src|dist)[\\/]main\.(?:ts|js)')
                has_bun_test    = [bool]($cmd -match '(?:^|\s)test(?:\s|$)')
              }
            } | Format-Table -AutoSize | Out-String | ForEach-Object { Write-Host $_ }
            Write-Host '--- partial bun test stdout so far ---'
            if (Test-Path $outLog) { Get-Content $outLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ } }
            Write-Host '--- partial bun test stderr so far ---'
            if (Test-Path $errLog) { Get-Content $errLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ } }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host '--- bun test stdout ---'
          if (Test-Path $outLog) { Get-Content $outLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ } }
          Write-Host '--- bun test stderr ---'
          if (Test-Path $errLog) { Get-Content $errLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ } }
          exit $proc.ExitCode

      - name: Start Vite dev server
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd packages/ui && bun run dev &
          echo "VITE_PID=$!" >> $GITHUB_ENV

      - name: Wait for Vite dev server
        if: matrix.os == 'ubuntu-latest'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Vite server failed to start"
          exit 1

      - name: Run Playwright smoke tests
        if: matrix.os == 'ubuntu-latest'
        run: bun run test:ui:smoke -- --base-url http://localhost:5173 --strict-testids

      - name: Stop Vite dev server
        if: always() && matrix.os == 'ubuntu-latest'
        run: kill $VITE_PID 2>/dev/null || true
