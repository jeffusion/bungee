name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows 测试暂停；恢复 Windows 矩阵时一并恢复以下配置。
    # continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers and Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: bun ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Install Playwright browsers
        if: matrix.os != 'ubuntu-latest'
        run: bun ./node_modules/playwright/cli.js install chromium

      - name: Run tests
        run: bun run test

      - name: Record tested PR contents
        if: matrix.os == 'ubuntu-latest'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-provenance"
          jq -n \
            --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg head "$PR_HEAD_SHA" \
            --argjson pr "$PR_NUMBER" \
            '{tree: $tree, head: $head, pr: $pr}' \
            > "$RUNNER_TEMP/ci-provenance/pr.json"

      - name: Upload tested PR contents
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tested-pr
          path: ${{ runner.temp }}/ci-provenance/pr.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
