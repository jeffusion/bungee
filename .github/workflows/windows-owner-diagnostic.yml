name: Windows owner diagnostic

on:
  push:
    branches: ['diagnostic/windows-owner']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Probe Win32_Process GetOwnerSid invocation forms
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Fixed-vocabulary outputs only; never SID/PID/path/argv/raw exceptions.
          # The target is this very PowerShell process ($PID), so the owner SID must
          # equal the current WindowsIdentity SID when both invocation forms work.
          $queryCount = 'error'
          $threeInvoke = 'error'; $threeReturn = 'missing'; $threeSid = 'missing'; $threeMatch = 'unknown'
          $arrayInvoke = 'error'; $arrayReturn = 'missing'; $arraySid = 'missing'; $arrayMatch = 'unknown'
          $currentSidOutcome = 'error'
          $sidPattern = '^S-\d-\d+(-\d+)+$'
          $currentSidValue = $null; $threeOwner = $null; $arrayOwner = $null

          try {
            try {
              $searcher = [System.Management.ManagementObjectSearcher]::new("SELECT ProcessId FROM Win32_Process WHERE ProcessId=$PID")
              $rows = @($searcher.Get())
              $queryCount = if ($rows.Count -eq 0) { 'zero' } elseif ($rows.Count -eq 1) { 'one' } else { 'many' }
            } catch { $queryCount = 'error' }
            if ($queryCount -ne 'one') { throw 'no unique target' }
            $target = $rows[0]

            # Form A: explicit InvokeMethodOptions, three-argument overload, GetPropertyValue reads.
            try {
              $options = [System.Management.InvokeMethodOptions]::new()
              $out = $target.InvokeMethod('GetOwnerSid', $null, $options)
              if ($null -eq $out) { throw 'null result' }
              $threeInvoke = 'ok'
              try {
                $rv = $out.GetPropertyValue('ReturnValue')
                if ($null -eq $rv) { $threeReturn = 'missing' } elseif ([uint32]$rv -ne 0) { $threeReturn = 'nonzero' } else { $threeReturn = 'zero' }
              } catch { $threeReturn = 'missing' }
              try {
                $sidValue = [string]$out.GetPropertyValue('Sid')
                if ([string]::IsNullOrEmpty($sidValue)) { $threeSid = 'missing' }
                elseif ($sidValue -cmatch $sidPattern) { $threeSid = 'valid'; $threeOwner = $sidValue }
                else { $threeSid = 'invalid' }
              } catch { $threeSid = 'missing' }
            } catch { $threeInvoke = 'error' }

            # Form B: two-argument array overload, return value as uint32, out argument at index 0.
            try {
              $invokeArgs = [object[]]@('')
              $retval = $target.InvokeMethod('GetOwnerSid', $invokeArgs)
              $arrayInvoke = 'ok'
              try {
                if ($null -eq $retval) { $arrayReturn = 'missing' } elseif ([uint32]$retval -ne 0) { $arrayReturn = 'nonzero' } else { $arrayReturn = 'zero' }
              } catch { $arrayReturn = 'missing' }
              try {
                $sidValue = [string]$invokeArgs[0]
                if ([string]::IsNullOrEmpty($sidValue)) { $arraySid = 'missing' }
                elseif ($sidValue -cmatch $sidPattern) { $arraySid = 'valid'; $arrayOwner = $sidValue }
                else { $arraySid = 'invalid' }
              } catch { $arraySid = 'missing' }
            } catch { $arrayInvoke = 'error' }
          } catch {
            # Root failure (query): keep the fixed vocabulary and still emit every field.
          }

          try {
            $currentSidValue = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            if ($null -ne $currentSidValue -and $currentSidValue -cmatch $sidPattern) { $currentSidOutcome = 'valid' } else { $currentSidOutcome = 'invalid' }
          } catch { $currentSidOutcome = 'error' }

          if ($threeSid -eq 'valid' -and $currentSidOutcome -eq 'valid') {
            $threeMatch = if ($threeOwner -ieq $currentSidValue) { 'yes' } else { 'no' }
          }
          if ($arraySid -eq 'valid' -and $currentSidOutcome -eq 'valid') {
            $arrayMatch = if ($arrayOwner -ieq $currentSidValue) { 'yes' } else { 'no' }
          }

          Write-Output "query_count=$queryCount"
          Write-Output "three_invoke=$threeInvoke"
          Write-Output "three_return=$threeReturn"
          Write-Output "three_sid=$threeSid"
          Write-Output "array_invoke=$arrayInvoke"
          Write-Output "array_return=$arrayReturn"
          Write-Output "array_sid=$arraySid"
          Write-Output "current_sid=$currentSidOutcome"
          Write-Output "three_match=$threeMatch"
          Write-Output "array_match=$arrayMatch"
          exit 0
