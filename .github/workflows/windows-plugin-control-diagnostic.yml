name: Windows plugin-control diagnostic

on:
  push:
    branches: [ diagnostic/windows-plugin-control ]

jobs:
  isolated:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun test packages/core/tests/integration/plugin-control-host.test.ts

  after-canonical:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test tests/real-process-canonical.test.ts packages/core/tests/integration/plugin-control-host.test.ts
