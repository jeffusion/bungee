name: Windows takeover diagnostic

on:
  push:
    branches: [ diagnostic/windows-takeover ]

jobs:
  takeover:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build full pipeline
        run: bun run build

      - name: Run canonical takeover only
        shell: pwsh
        run: |
          $outLog = Join-Path $env:RUNNER_TEMP 'takeover-stdout.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'takeover-stderr.log'
          bun test tests/real-process-canonical.test.ts 1> $outLog 2> $errLog
          $code = $LASTEXITCODE
          Get-Content $outLog -ErrorAction SilentlyContinue
          Get-Content $errLog -ErrorAction SilentlyContinue
          exit $code

      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-takeover-diagnostic
          path: |
            ${{ runner.temp }}/takeover-stdout.log
            ${{ runner.temp }}/takeover-stderr.log
          if-no-files-found: warn
          retention-days: 1
