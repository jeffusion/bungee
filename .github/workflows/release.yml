name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read
  id-token: write
  packages: write  # Required for pushing to GitHub Container Registry

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit and establish main branch
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git checkout -B main "$RELEASE_SHA"

      # Verify PR checks before using the dedicated App for version metadata.
      - name: Verify merged PR and successful CI
        id: verified-pr
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...repo, commit_sha: context.sha, per_page: 100 }
            );
            const candidate = associated.find(pr =>
              pr.merged_at && pr.base.ref === 'main' &&
              pr.base.repo.full_name === process.env.GITHUB_REPOSITORY &&
              pr.merge_commit_sha === context.sha
            );
            if (!candidate) {
              throw new Error('Release commit must be the final commit of a merged main PR');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...repo, pull_number: candidate.number
            });
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'ci.yml', event: 'pull_request',
              head_sha: pr.head.sha, per_page: 100
            });
            const run = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error(`PR #${pr.number} must have a successful latest CI run`);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: run.id, filter: 'all', per_page: 100
            });
            jobs.sort((a, b) => b.id - a.id);
            // Windows 测试及发布校验暂停；仅检查 Linux/macOS。
            for (const os of [
              'ubuntu-latest',
              'macos-latest',
              // 'windows-latest',
            ]) {
              const job = jobs.find(job => job.name === `test (${os})`);
              if (!job || job.conclusion !== 'success') {
                throw new Error(`PR #${pr.number} is missing a successful test (${os})`);
              }
            }
            core.setOutput('run-id', String(run.id));
            core.setOutput('number', String(pr.number));
            core.setOutput('head', pr.head.sha);
            core.info(`Verified PR #${pr.number}, CI run ${run.id}`);

      - name: Download tested PR contents
        uses: actions/download-artifact@v4
        with:
          name: tested-pr
          path: ${{ runner.temp }}/ci-provenance
          run-id: ${{ steps.verified-pr.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm release contents match tested PR
        env:
          PR_NUMBER: ${{ steps.verified-pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.verified-pr.outputs.head }}
        run: |
          set -euo pipefail
          EXPECTED_TREE=$(git rev-parse 'HEAD^{tree}')
          echo "Expected provenance: tree=$EXPECTED_TREE head=$PR_HEAD_SHA pr=$PR_NUMBER"
          cat "$RUNNER_TEMP/ci-provenance/pr.json"
          jq -e \
            --arg tree "$EXPECTED_TREE" \
            --arg head "$PR_HEAD_SHA" \
            --argjson pr "$PR_NUMBER" \
            '.tree == $tree and .head == $head and .pr == $pr' \
            "$RUNNER_TEMP/ci-provenance/pr.json"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Ensure npm version for Trusted Publishing
        run: |
          echo "Node before npm upgrade: $(node --version)"
          echo "npm before npm upgrade: $(npm --version)"
          npm install -g npm@11.6.2
          NPM_BIN=$(command -v npm)
          NPM_VERSION=$(npm --version)
          MIN_NPM=11.5.1
          echo "NPM_BIN=$NPM_BIN" >> $GITHUB_ENV
          echo "Using npm binary: $NPM_BIN"
          echo "Node after npm upgrade: $(node --version)"
          echo "npm after npm upgrade: $NPM_VERSION"
          if [ "$(printf '%s\n%s\n' "$MIN_NPM" "$NPM_VERSION" | sort -V | head -n1)" != "$MIN_NPM" ]; then
            echo "npm $NPM_VERSION is too old, require >= $MIN_NPM"
            exit 1
          fi

      - name: Capture pre-release version
        id: pre-version
        run: |
          PRE_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PRE_VERSION" >> $GITHUB_OUTPUT
          echo "Pre-release version: $PRE_VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build full pipeline
        run: bun run build

      - name: Create release App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Verify release App identity and token repository scope
        uses: actions/github-script@v7
        env:
          EXPECTED_APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.release-app-token.outputs.installation-id }}
        with:
          github-token: ${{ steps.release-app-token.outputs.token }}
          script: |
            const expectedAppId = Number(process.env.EXPECTED_APP_ID);
            const appSlug = process.env.APP_SLUG;
            if (!process.env.EXPECTED_APP_ID || !Number.isSafeInteger(expectedAppId) || expectedAppId <= 0) {
              throw new Error('RELEASE_APP_ID must be a non-empty positive integer');
            }
            const installationId = process.env.INSTALLATION_ID;
            if (!installationId || !/^\d+$/.test(installationId)
              || !Number.isSafeInteger(Number(installationId)) || Number(installationId) <= 0) {
              throw new Error('Release App installation id is missing or invalid');
            }

            const { data: installation } = await github.request('GET /installation/repositories');
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (installation.total_count !== 1 || installation.repositories?.length !== 1
              || installation.repositories[0].full_name !== repository) {
              throw new Error(`Release App token repository scope does not match ${repository}`);
            }
            // The token action binds this App ID using the private key and its own JWT authentication flow.
            core.info(`Verified App id=${expectedAppId} slug=${appSlug ?? ''} installation id=${installationId} repository=${repository}`);

      - name: Confirm main has not advanced
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$REMOTE_MAIN" != "$RELEASE_SHA" ]; then
            echo "Remote main ($REMOTE_MAIN) no longer matches release commit ($RELEASE_SHA)"
            exit 1
          fi

      - name: Run semantic-release
        id: semantic-release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GITHUB_REF: refs/heads/main
          GITHUB_SHA: ${{ github.sha }}

      - name: Detect whether a new release was published
        id: release-state
        run: |
          POST_VERSION=$(node -p "require('./package.json').version")
          PRE_VERSION="${{ steps.pre-version.outputs.version }}"
          if [ "$POST_VERSION" != "$PRE_VERSION" ]; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "version=$POST_VERSION" >> $GITHUB_OUTPUT
            echo "Release published: $PRE_VERSION -> $POST_VERSION"
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "version=$POST_VERSION" >> $GITHUB_OUTPUT
            echo "No new release published"
          fi

      # Docker build and push steps
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: package-version
        if: steps.release-state.outputs.published == 'true'
        run: |
          VERSION="${{ steps.release-state.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build and push Docker image
        if: steps.release-state.outputs.published == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bungee:latest
            ghcr.io/${{ github.repository_owner }}/bungee:${{ steps.package-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and upload binaries to GitHub Release
      - name: Build binaries
        if: steps.release-state.outputs.published == 'true'
        run: bun run build:binaries

      - name: Upload binaries to GitHub Release
        if: steps.release-state.outputs.published == 'true'
        run: bun scripts/release/upload-binaries.ts ${{ steps.package-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
