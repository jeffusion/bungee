name: Windows plugin-control fixed diagnostic

on:
  push:
    branches: [ diagnostic/windows-plugin-control-fixed ]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun test packages/core/tests/integration/plugin-control-host.test.ts
